spring.application.name=horarios-unbosque
server.port=8080

# Base de datos embebida en memoria: se crea y se llena con datos de prueba en cada arranque.
spring.datasource.url=jdbc:h2:mem:horarios;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Consola de H2 para mostrar las tablas en la exposición: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:horarios   Usuario: sa   Contraseña: (vacía)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.hibernate.SQL=warn
